  <!-- Google Material Symbols -->

  <style data-purpose="ambient-effects">
    /* Global Reset to eliminate browser default blue underlined links */
    a, a:visited, a:hover, a:active {
      text-decoration: none !important;
      color: inherit;
    }
    
    body {
      background: linear-gradient(135deg, #222B3A 0%, #151A24 50%, #0B0E14 100%);
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glowing orbs inside Ikigai card */
    .bokeh-dot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }

    /* Realistic 3D book spine shadow */
    .book-shadow {
      box-shadow: -4px 6px 16px rgba(0, 0, 0, 0.6), 0 10px 24px -5px rgba(0, 0, 0, 0.8);
    }
    .book-spine {
      position: relative;
    }
    .book-spine::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.4) 100%);
      border-top-left-radius: inherit;
      border-bottom-left-radius: inherit;
      z-index: 2;
    }

    /* Golden text glow */
    .gold-glow {
      text-shadow: 0 0 16px rgba(241, 214, 158, 0.4);
    }

    /* Custom utility styles for smooth SPA app shell */
    .nav-active {
      color: #F1D69E !important;
      background: #181E29 !important;
      box-shadow: 0 0 18px rgba(241, 214, 158, 0.22);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <link rel="stylesheet" href="css/audio-player.css"/>
  <link rel="stylesheet" href="css/shell.css"/>
  <link rel="stylesheet" href="css/theme.css"/>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#181E29] via-[#131722] to-[#0E1217] bg-fixed text-slate-200 antialiased selection:bg-goldAccent/30 selection:text-white">
  
  <div class="flex w-full relative min-h-screen">
    
    <!-- Unified Sidebar Navigation -->
    <aside id="app-sidebar" class="w-16 md:w-[72px] flex flex-col items-center py-7 gap-8 border-r border-[#1B2230]/70 shrink-0 z-40 bg-[#0C1016] sticky top-0 h-screen transition-all">
      <!-- App Brand Mark -->
      <a href="#/landing" class="w-8 h-8 flex items-center justify-center hover:opacity-80 transition-opacity" title="NovelCast">
        <img src="logo.svg" alt="NovelCast Logo" class="w-full h-full object-contain" />
      </a>

      <!-- Main Navigation Icons -->
      <nav id="main-nav" class="nc-main-nav" aria-label="Main navigation">
        <a class="nc-nav-link" href="#/home" data-nav-route="home" aria-label="Home" title="Home"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></a>
        <a class="nc-nav-link" href="#/search" data-nav-route="search" aria-label="Search" title="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></a>
        <a class="nc-nav-link" href="#/library" data-nav-route="library" aria-label="My Library" title="My Library"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h4v14H3zm7 0h4v14h-4zm7 1 3-1 3 13-3 1z"/></svg></a>
      </nav>
    </aside>

    <!-- App Content Wrapper -->
    <div id="app-content-wrapper" class="flex-1 flex flex-col px-4 sm:px-6 md:px-10 py-5 min-w-0 overflow-x-hidden transition-all">
      
      <!-- Shared Header -->
      <header id="app-header" class="w-full flex items-center justify-between pb-6 pt-1 border-b border-[#1A2230]/50 mb-6 transition-all">
        <a href="#/home" class="flex items-center gap-3 group focus:outline-none cursor-pointer">
          <img src="logo.svg" alt="NovelCast Logo" class="h-8 w-auto object-contain" />
          <span class="font-serif text-xl tracking-tight font-medium text-white group-hover:text-neutral-200 transition-colors">
            NovelCast
          </span>
        </a>

        <!-- Header Actions -->
        <div class="nc-header-actions">
          <button type="button" aria-label="Notifications" class="nc-header-notifications" onclick="window.NovelCast.toast('No new notifications')">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
          </button>
          <button class="nc-theme-toggle" type="button" data-theme-toggle aria-label="Light mode" aria-pressed="false">
            <svg class="nc-theme-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>
            </svg>
            <svg class="nc-theme-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <path d="M20.7 14.2A9 9 0 0 1 9.8 3.3a9 9 0 1 0 10.9 10.9Z"/>
            </svg>
          </button>
          <a id="header-user-btn" class="nc-profile-button" href="#/login" aria-label="Sign in" title="Sign in">
            <span data-profile-guest><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg></span>
            <span data-profile-initials hidden aria-hidden="true"></span>
          </a>
        </div>
      </header>

      <!-- Dynamic View Container (SPA Mount Target) -->
      <main id="app-view" class="flex-1 w-full relative min-h-0">
        <!-- Content dynamically injected by router -->
      </main>

    </div>
  </div>


  <!-- Persistent Global Audio Player Bar -->
  <section id="global-audio-player" class="nc-audio-player" aria-label="Book narration player" hidden>
    <div class="nc-audio-copy">
      <h4 id="player-title">Book narration</h4>
      <div class="nc-audio-meta">
        <p id="player-chapter"></p>
        <p id="player-voice"></p>
      </div>
      <p id="player-status" role="status" aria-live="polite"></p>
    </div>
    <div class="nc-audio-actions">
      <button id="player-play-btn" type="button" aria-label="Pause listening">Pause</button>
      <button id="player-retry-btn" type="button" hidden>Retry</button>
      <button id="player-close-btn" type="button" aria-label="Close narration player">Close</button>
    </div>
  </section>

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Environment Configuration (Generated from .env) -->
  <script src="js/env.js"></script>

  <!-- Core Scripts in Order -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/components/pixelCard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  
  <!-- View Controllers -->
  <script src="js/views/homeView.js"></script>
  <script src="js/views/searchView.js"></script>
  <script src="js/views/libraryView.js"></script>
  <script src="js/views/bookDetailsView.js"></script>
  <script src="js/views/readerView.js"></script>
  <script src="js/views/landingView.js"></script>
  <script src="js/views/loginView.js"></script>

  <!-- App Core & SPA Router -->
  <script src="js/audioPlayer.js"></script>
  <script src="js/app.js"></script>
  <script src="js/router.js"></script>

  <!-- Boot SPA -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.NovelCastProfile.init();
      window.NovelCastAuth?.init();

      // Initialize SPA Router
      window.NovelCastRouter.init();
    });
  </script>
</body>
