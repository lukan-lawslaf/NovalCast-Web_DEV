  <style data-purpose="ambient-effects">
    /* Global Reset to eliminate browser default blue underlined links */
    a, a:visited, a:hover, a:active {
      text-decoration: none !important;
      color: inherit;
    }
    
    body {
      background-color: #080A0E;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glowing orbs inside Ikigai card */
    .bokeh-dot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }

    /* Realistic 3D book spine shadow */
    .book-shadow {
      box-shadow: -4px 6px 16px rgba(0, 0, 0, 0.6), 0 10px 24px -5px rgba(0, 0, 0, 0.8);
    }
    .book-spine {
      position: relative;
    }
    .book-spine::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.4) 100%);
      border-top-left-radius: inherit;
      border-bottom-left-radius: inherit;
      z-index: 2;
    }

    /* Golden text glow */
    .gold-glow {
      text-shadow: 0 0 16px rgba(243, 209, 130, 0.4);
    }

    /* Custom utility styles for smooth SPA app shell */

      color: #F5D77F !important;
      background: #181D26 !important;
      box-shadow: 0 0 18px rgba(243, 209, 130, 0.22);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

<body class="min-h-screen bg-[#05070A] text-slate-200 antialiased selection:bg-goldAccent/30 selection:text-white">

  <!-- Persistent Global Audio Player Bar -->
  <div id="global-audio-player" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-2xl bg-[#141924]/95 backdrop-blur-xl border border-goldAccent/30 rounded-full px-5 py-3 shadow-[0_12px_40px_rgba(0,0,0,0.8)] flex items-center justify-between gap-4 transition-all duration-300 translate-y-24 opacity-0 pointer-events-none">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-lg overflow-hidden shrink-0 border border-white/10 shadow" id="player-thumb"></div>
      <div class="truncate">
        <h4 class="text-xs font-bold text-white truncate" id="player-title">Track Title</h4>
        <p class="text-[10px] text-[#8C98AC] truncate" id="player-narrator">Narrator</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <button class="w-8 h-8 rounded-full bg-goldAccent text-[#121620] flex items-center justify-center hover:scale-105 transition-transform" id="player-play-btn">
        <span class="material-symbols-outlined text-[18px]" id="player-play-icon">pause</span>
      </button>
      <button class="text-[#7E8B9C] hover:text-white transition-colors" id="player-close-btn" title="Close">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  </div>

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Core Scripts in Order -->

  <script src="js/components/pixelCard.js"></script>
  <script src="js/ui.js"></script>

  <script src="js/views/readerView.js"></script>
  <script src="js/views/landingView.js"></script>
  <script src="js/views/loginView.js"></script>

  <!-- App Core & SPA Router -->
  <script src="js/app.js"></script>
  <script src="js/router.js"></script>

  <!-- Boot SPA -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Global persistent player logic
      window.NovelCastApp = Object.assign(window.NovelCastApp || {}, {
        toggleAudio: function (trackId) {
          const player = document.getElementById('global-audio-player');
          const titleEl = document.getElementById('player-title');
          const narratorEl = document.getElementById('player-narrator');
          const thumbEl = document.getElementById('player-thumb');
          const iconEl = document.getElementById('player-play-icon');

          if (!player) return;

          const bookId = trackId.replace('book-', '');
          const book = window.NovelCast.getBook(bookId) || window.NovelCast.books[0];

          titleEl.textContent = book.title;
          narratorEl.textContent = book.narrator || book.author;
          thumbEl.innerHTML = window.NovelCastView.cover(book);

          player.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
          player.classList.add('translate-y-0', 'opacity-100');
          iconEl.textContent = 'pause';
          window.NovelCast.toast(`Playing: ${book.title}`);
        },
        bindInteractiveElements: function (scope) {
          if (window.NovelCastUI) {
            window.NovelCastUI.installBookLinks(scope);
            window.NovelCastUI.installFavoriteToggle(scope);
            window.NovelCastUI.installLibraryToggle(scope);
          }
          (scope || document).querySelectorAll('[data-audio-stub]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.preventDefault();
              window.NovelCastApp.toggleAudio(btn.dataset.audioStub);
            });
          });
        }
      });

      // Player close button
      const closeBtn = document.getElementById('player-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          const player = document.getElementById('global-audio-player');
          player.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
          player.classList.remove('translate-y-0', 'opacity-100');
        });
      }

      // Initialize Supabase Auth & Sync Indicator
      if (window.NovelCastAuth) {
        window.NovelCastAuth.init().then(user => {
          const indicator = document.getElementById('user-auth-indicator');
          if (indicator) indicator.classList.toggle('hidden', !user);
        });
        window.NovelCastAuth.onAuthStateChange(user => {
          const indicator = document.getElementById('user-auth-indicator');
          if (indicator) indicator.classList.toggle('hidden', !user);
        });
      }

      // Initialize SPA Router
      window.NovelCastRouter.init();
    });
  </script>
